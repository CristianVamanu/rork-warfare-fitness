<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1024px;height:1623px;background:transparent;font-family:'Inter',sans-serif;overflow:hidden}
.a{position:absolute}
#top{left:7%;top:16.2%;font-size:53px;font-weight:800;letter-spacing:.03em;color:#fff}
#tier{right:7%;top:16%;font-size:64px;font-weight:900;font-style:italic;text-transform:uppercase;color:#fff}
#rz{left:0;right:0;top:22.5%;text-align:center;font-size:364px;font-weight:900;color:#fff;line-height:1;transform:scaleY(2.3) skewX(-9deg);transform-origin:50% 0;letter-spacing:-.04em}
#em{left:50%;top:52%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
#em .ring{position:absolute;inset:0;border-radius:50%;border:13px solid #fff}
#em .core{position:absolute;inset:26%;border-radius:50%;background:#05070b;border:15px solid #fff}
#em .v{position:absolute;left:50%;top:-6%;bottom:-6%;width:14px;margin-left:-7px;background:#fff}
#em .h{position:absolute;top:50%;left:-6%;right:-6%;height:14px;margin-top:-7px;background:#fff}
#lab{left:4%;right:4%;bottom:10.5%;text-align:center;font-size:61px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#fff;line-height:1.3}
</style></head><body>
<div id="top" class="a">WARFARE FITNESS</div><div id="tier" class="a"></div>
<div id="rz" class="a">RIPZ</div>
<div id="em" class="a"><div id="disc" style="position:absolute;inset:0;border-radius:50%"></div><div class="v"></div><div class="h"></div><div class="ring"></div><div class="core"></div></div>
<div id="lab" class="a"></div>
<script>
const q=new URLSearchParams(location.search);const c=q.get('c').split(',').map(x=>'#'+x);
document.getElementById('tier').textContent=q.get('id');document.getElementById('lab').textContent=q.get('label')+' challenge pack';
document.getElementById('disc').style.background=`radial-gradient(circle at 35% 30%, ${c[0]}, ${c[2]} 62%, #05070b 100%)`;
if(q.get('mode')==='mask'){document.body.innerHTML='';const T=16;let top=[],bot=[];for(let i=0;i<=T*2;i++){const x=i/(T*2)*100;top.push(`${x}% ${i%2?0:1.5}%`);bot.push(`${100-x}% ${i%2?100:98.5}%`)}
 const d=document.createElement('div');d.style.cssText=`position:absolute;inset:0;background:#fff;clip-path:polygon(${[...top,...bot].join(',')})`;document.body.appendChild(d);}
if(q.get('mode')==='blank'){document.body.innerHTML='';}
</script></body></html>
