<!doctype html><html><head><meta charset="utf-8">
<!-- Warfare Fitness "battle" reel. Same look as panels.html (dark, orange,
     white clip panels), different structure: a question, then rounds. Each
     round names a category, waits a beat, then reveals which exercise takes
     it and the score ticks. A winner at the end. The wait before each reveal
     is the point: there is always a result still to come.
     battle.html?c=<key>  ·  render_panels.mjs drives window.setT(t). -->
<style>
@font-face{font-family:Kanit;src:url(kanit-800-italic.woff2)}
@font-face{font-family:Barlow;src:url(barlow-condensed-700.woff2)}
:root{--o:#FF7A1A;--o2:#FFA62B;--line:#2A2A30}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0B0B0D;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 100% 0%,rgba(255,122,26,.20),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(255,122,26,.16),transparent 60%),linear-gradient(180deg,#0E0E11,#08080A)}
#r{position:absolute;inset:0;transform:scale(.88);transform-origin:50% 50%}
.streak{position:absolute;height:14px;background:linear-gradient(90deg,transparent,var(--o),var(--o2));transform:rotate(-38deg);border-radius:8px;filter:drop-shadow(0 0 14px rgba(255,122,26,.7))}
.kan{font-family:Kanit;font-style:italic;font-weight:800;text-transform:uppercase;line-height:.94}
.or{background:linear-gradient(180deg,var(--o2),var(--o));-webkit-background-clip:text;background-clip:text;color:transparent}
.wh{background:linear-gradient(180deg,#fff,#C9C9D0);-webkit-background-clip:text;background-clip:text;color:transparent}
.abs{position:absolute}
.panel{position:absolute;top:330px;width:478px;height:478px;background:#fff;border-radius:34px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ring{position:absolute;top:330px;width:478px;height:478px;border-radius:34px;border:6px solid var(--o);box-shadow:0 0 60px rgba(255,122,26,.75), inset 0 0 30px rgba(255,122,26,.25);opacity:0;pointer-events:none}
.name{position:absolute;top:830px;width:478px;text-align:center;font-size:54px}
.score{position:absolute;top:920px;width:478px;text-align:center;font-size:190px;line-height:1}
.lab{font:700 24px Inter;letter-spacing:.22em;color:var(--o);text-transform:uppercase}
.card{position:absolute;left:50px;right:50px;top:1180px;height:400px;border:2px solid rgba(255,122,26,.5);border-radius:30px;background:linear-gradient(180deg,rgba(22,22,26,.96),rgba(12,12,14,.96));text-align:center;padding:34px 30px;box-shadow:0 0 40px rgba(255,122,26,.18)}
.pt{display:inline-block;padding:10px 26px;border-radius:14px;background:var(--o);color:#140800;font:800 34px Barlow;letter-spacing:.04em;text-transform:uppercase}
.pips{position:absolute;left:0;right:0;top:1126px;display:flex;justify-content:center;gap:14px}
.pips i{width:86px;height:8px;border-radius:4px;background:#2A2A30}.pips i.on{background:var(--o);box-shadow:0 0 12px rgba(255,122,26,.7)}
.full{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 70px}
</style></head><body><div class="bg"></div><div id="r"></div>
<script src="battles.js"></script>
<script>
const Q=new URLSearchParams(location.search), B=window.BATTLES[Q.get('c')||'chinup_pullup'], SP=+(Q.get('speed')||2.5);
const r=document.getElementById('r'), h=(s,root=r)=>{root.insertAdjacentHTML('beforeend',s);return root.lastElementChild;};
// timeline (seconds)
const HOOK=1.4, ROUND=3.1, N=B.rounds.length, END=HOOK+N*ROUND, CTA=END+2.0, DUR=CTA+2.0; window.DUR=DUR;
h(`<div class="streak" style="width:460px;left:-170px;top:90px"></div>`);h(`<div class="streak" style="width:460px;right:-170px;top:40px"></div>`);h(`<div class="streak" style="width:520px;left:-240px;top:1730px"></div>`);
h(`<img src="logo-wf.webp" class="abs" style="left:50%;transform:translateX(-50%);top:150px;height:54px">`);
h(`<div class="abs lab" style="left:0;right:0;top:246px;text-align:center;font-size:26px">${B.basis}</div>`);
const X=[50,552], side=[B.a,B.b];
const img=side.map((s,i)=>h(`<div class="panel" style="left:${X[i]}px"><img></div>`).querySelector('img'));
const ring=side.map((s,i)=>h(`<div class="ring" style="left:${X[i]}px"></div>`));
const dim=side.map((s,i)=>h(`<div class="abs" style="left:${X[i]}px;top:330px;width:478px;height:478px;border-radius:34px;background:rgba(8,8,10,.62);opacity:0"></div>`));
side.forEach((s,i)=>h(`<div class="name kan wh" style="left:${X[i]}px;font-size:${s.name.length>11?44:54}px">${s.name}</div>`));
const score=side.map((s,i)=>h(`<div class="score kan or" style="left:${X[i]}px">0</div>`));
h(`<div class="abs kan" style="left:0;right:0;top:985px;text-align:center;font-size:70px;color:#4a4a52">–</div>`);
const pips=h(`<div class="pips">${B.rounds.map(()=>'<i></i>').join('')}</div>`);
const cards=B.rounds.map((R,i)=>h(`<div class="card">
  <div class="lab">Round ${i+1} of ${N}</div>
  <div class="kan wh" style="font-size:${R.cat.length>12?84:104}px;margin-top:14px;white-space:nowrap">${R.cat}</div>
  <div class="res" style="margin-top:22px"><span class="pt">${R.win==='draw'?'Draw':'Point: '+(R.win==='a'?B.a.name:B.b.name)}</span>
  <div style="font:600 30px/1.3 Inter;color:#E6E6EA;margin-top:18px">${R.why}</div></div>
  <div class="wait kan" style="position:absolute;left:0;right:0;top:238px;font-size:70px;color:#6b6b74">?</div></div>`));
const fin=h(`<div class="card" style="border-color:var(--o);box-shadow:0 0 60px rgba(255,122,26,.45)">
  <div class="lab">${B.finalLabel||'Final score'}</div>
  <div class="kan" style="font-size:${B.final.length>16?74:96}px;margin-top:18px;line-height:1"><span class="wh">${B.final[0]}</span><br><span class="or">${B.final[1]}</span></div>
  <div style="font:600 30px/1.3 Inter;color:#E6E6EA;margin-top:20px">${B.verdict}</div></div>`);
const hook=h(`<div class="full" style="background:radial-gradient(900px 700px at 50% 45%,rgba(255,122,26,.22),transparent 65%),#0B0B0D">
  <img src="logo-wf.webp" style="height:54px;position:absolute;top:262px">
  <div class="kan" style="font-size:${(B.hook[0]+B.hook[1]).length>20?112:136}px"><span class="wh">${B.hook[0]}</span><br><span class="or">${B.hook[1]}</span></div>
  <div style="margin-top:40px;font:700 48px Barlow;text-transform:uppercase;letter-spacing:.03em;color:#E6E6EA">${N} rounds. One winner.</div></div>`,document.body);
const cta=h(`<div class="full" style="background:rgba(8,8,10,.95);opacity:0">
  <img src="logo-wf.webp" style="height:70px;margin-bottom:56px">
  <div class="kan" style="font-size:96px"><span class="wh">${B.ask[0]}</span><br><span class="or">${B.ask[1]}</span></div>
  <div style="margin-top:36px;font:700 44px Barlow;text-transform:uppercase;color:#E6E6EA">Comment below 👇</div>
  <div style="margin-top:70px;padding:24px 40px;border:2px solid #FF7A1A;border-radius:26px;background:#121215;box-shadow:0 0 40px rgba(255,122,26,.35)">
    <div style="font:700 26px Inter;letter-spacing:.18em;color:#FF7A1A;text-transform:uppercase">Follow for the next battle</div>
    <div class="kan wh" style="font-size:58px;margin-top:10px">@warfarefitnessapp</div></div></div>`,document.body);
const cl=(x)=>Math.min(1,Math.max(0,x)), ease=(x)=>{x=cl(x);return 1-Math.pow(1-x,3);}, back=(x)=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const REVEAL=1.25; // seconds a round waits before its result
window.setT=async(t)=>{
  { const k=cl((t-(HOOK-.3))/.3); hook.style.opacity=1-k; hook.style.transform=`scale(${1+.08*k})`; hook.style.visibility=k>=1?'hidden':'visible'; }
  const pts=[0,0]; let glow=[0,0], dimv=[0,0], bump=[0,0];
  B.rounds.forEach((R,i)=>{
    const t0=HOOK+i*ROUND, t1=t0+ROUND, c=cards[i], on=t>=t0&&t<t1;
    const a=ease((t-t0)/.3), b=ease((t-(t1-.2))/.2);
    c.style.opacity=on?a*(1-b):0; c.style.visibility=on?'visible':'hidden'; c.style.translate=`0 ${(1-a)*50}px`;
    const rv=t-(t0+REVEAL), k=back(rv/.32);
    c.querySelector('.res').style.opacity=cl(rv/.15); c.querySelector('.res').style.scale=rv>0?.8+.2*k:.8;
    const w=c.querySelector('.wait'); w.style.opacity=rv>0?0:.5+.5*Math.sin(t*9);
    if(rv>0){ if(R.win==='a'||R.win==='draw')pts[0]++; if(R.win==='b'||R.win==='draw')pts[1]++; }
    if(on&&rv>0){ const fade=1-cl((t-(t1-.25))/.25), g=cl(rv/.2)*fade;
      if(R.win!=='b'){glow[0]=g;bump[0]=Math.max(0,1-rv/.35);} if(R.win!=='a'){glow[1]=g;bump[1]=Math.max(0,1-rv/.35);}
      if(R.win==='a')dimv[1]=g; if(R.win==='b')dimv[0]=g; }
  });
  [...pips.children].forEach((p,i)=>p.className=t>=HOOK+i*ROUND+REVEAL?'on':'');
  const endOn=t>=END, ea=ease((t-END)/.35);
  fin.style.opacity=endOn?ea:0; fin.style.visibility=endOn?'visible':'hidden'; fin.style.scale=.9+.1*back((t-END)/.4);
  if(endOn&&B.winner){ const w=B.winner==='a'?0:1; glow[w]=ea; dimv[1-w]=ea*.8; }
  [0,1].forEach(i=>{ ring[i].style.opacity=glow[i]; dim[i].style.opacity=dimv[i]; score[i].textContent=pts[i]; score[i].style.scale=1+.35*bump[i]; });
  { const k=ease((t-CTA)/.35); cta.style.opacity=k; cta.style.translate=`0 ${(1-k)*40}px`; }
  const f=(s)=>s.fr+'/f_'+String(Math.floor(Math.max(0,t-HOOK+.4)*29.97*SP)%(s.n||197)).padStart(4,'0')+'.jpg';
  img[0].src=f(B.a); img[1].src=f(B.b); await Promise.all([img[0].decode(),img[1].decode()]);
};
setT(+(Q.get('t')||0));
</script></body></html>
