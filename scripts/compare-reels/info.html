<!doctype html><html><head><meta charset="utf-8">
<!-- "Useful info" reel, 15 s, 1080x1920. A realistic cold open (hook/f_XXXX.jpg,
     frames from an AI clip; a dark plate stands in when absent), then the
     claim shown with library clips, then the study result as bars, the
     takeaway and the save prompt. Content in INFO below; every number must
     come from the cited source. render_panels.mjs drives setT (PAGE=info.html). -->
<style>
@font-face{font-family:Kanit;src:url(kanit-800-italic.woff2)}
@font-face{font-family:Barlow;src:url(barlow-condensed-700.woff2)}
:root{--o:#FF7A1A;--o2:#FFA62B}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0A0A0C;overflow:hidden;font-family:Inter,"Helvetica Neue",system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 100% 0%,rgba(255,122,26,.18),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(255,122,26,.14),transparent 60%),linear-gradient(180deg,#0E0E11,#08080A)}
.kan{font-family:Kanit;font-style:italic;font-weight:800;text-transform:uppercase;line-height:.94}
.or{background:linear-gradient(180deg,var(--o2),var(--o));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.lab{font:700 24px Inter;letter-spacing:.24em;color:var(--o);text-transform:uppercase}
.abs{position:absolute}.L{position:absolute;inset:0}
#r{position:absolute;inset:0;transform:scale(.88);transform-origin:50% 50%}
.panel{position:absolute;top:470px;width:470px;height:470px;background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pname{position:absolute;top:980px;width:470px;text-align:center;font-size:58px}
.pnote{position:absolute;top:1050px;width:470px;text-align:center;font:600 28px Inter;color:#C9C9D0}
.row{position:absolute;left:70px;right:70px}
.row .t{display:flex;justify-content:space-between;align-items:baseline}
.row .t b{font-family:Kanit;font-style:italic;font-weight:800;text-transform:uppercase;font-size:48px}
.row .t span{font:600 26px Inter;color:#A7A7B0}
.bar{position:relative;height:44px;border-radius:12px;background:#1C1C21;margin-top:12px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:12px}
.bar em{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:800 28px Inter;font-style:normal;color:#fff!important;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.full i{background:linear-gradient(90deg,#E87900,#FFA51E,#FFC45A);box-shadow:0 0 20px rgba(255,150,20,.6)}
.half i{background:#55555E}
.key{display:flex;gap:30px;justify-content:center;font:700 26px Inter;color:#D8D8DE}
.key i{display:inline-block;width:26px;height:26px;border-radius:7px;vertical-align:-5px;margin-right:10px}
#hookimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style></head><body><div class="bg"></div><div id="r"></div>
<script>
const INFO={
  hook:['Your squat','stops working here'],
  a:{name:'Half squat',note:'Stops well above parallel',fr:'fr_Classic_Barbell_Squat',from:0,to:55},
  b:{name:'Full squat',note:'Thighs past parallel',fr:'fr_Classic_Barbell_Squat',from:0,to:196},
  studyTitle:['Same lift.','Different results.'],
  study:'10 weeks · MRI scans · Kubo et al., 2019',
  rows:[
    {name:'Glutes',a:2.2,b:6.7,unit:'% bigger'},
    {name:'Inner thighs',a:2.7,b:6.2,unit:'% bigger'},
    {name:'Full squat strength',a:11.3,b:31.8,unit:'% stronger'},
  ],
  quads:'Quads grew about the same in both groups',
  take:['Go deep.','Own the bottom.'],
  takeSub:'Squat as low as you can control with good form. Thighs at least to parallel.',
  small:'Small study: 17 men, 10 weeks.',
};
const Q=new URLSearchParams(location.search), r=document.getElementById('r');
const h=(s,root=r)=>{root.insertAdjacentHTML('beforeend',s);return root.lastElementChild;};
const cl=x=>Math.min(1,Math.max(0,x)), ease=x=>{x=cl(x);return 1-Math.pow(1-x,3);}, win=(t,a,b,fi=.3,fo=.3)=>cl((t-a)/fi)*(1-cl((t-(b-fo))/fo));
const T={hook:0,cmp:2.4,res:6.0,take:11.6,cta:13.4,end:15}; window.DUR=T.end;
const HOOKN=+(Q.get('hookn')||0), HSP=+(Q.get('hsp')||1.25);
// hook: full-bleed footage (outside the safe-zone scale) with the line on top
const hook=h(`<div class="L" style="z-index:30;background:#060606">${HOOKN?'<img id="hookimg">':''}
 <div class="L" style="background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)"></div>
 <div class="abs kan" style="left:60px;right:60px;top:300px;text-align:center;font-size:118px;text-shadow:0 6px 30px rgba(0,0,0,.6)">${INFO.hook[0]}<br><span class="or">${INFO.hook[1]}</span></div></div>`,document.body);
const himg=hook.querySelector('#hookimg');
// comparison
const cmp=h(`<div class="L"><img src="logo-wf.webp" class="abs" style="left:50%;transform:translateX(-50%);top:200px;height:54px">
 <div class="abs kan" style="left:0;right:0;top:300px;text-align:center;font-size:84px">Half <span class="or">vs</span> full</div></div>`);
const X=[45,565], P=[INFO.a,INFO.b];
const imgs=P.map((p,i)=>{const e=h(`<div class="panel" style="left:${X[i]}px"><img></div>`,cmp);h(`<div class="pname kan ${i?'or':''}" style="left:${X[i]}px">${p.name}</div>`,cmp);h(`<div class="pnote" style="left:${X[i]}px">${p.note}</div>`,cmp);return e.querySelector('img');});
// results
const res=h(`<div class="L"><img src="logo-wf.webp" class="abs" style="left:50%;transform:translateX(-50%);top:200px;height:54px">
 <div class="abs kan" style="left:0;right:0;top:300px;text-align:center;font-size:90px">${INFO.studyTitle[0]}<br><span class="or">${INFO.studyTitle[1]}</span></div>
 <div class="abs lab" style="left:0;right:0;top:500px;text-align:center;font-size:22px">${INFO.study}</div>
 <div class="abs key" style="left:0;right:0;top:560px"><span><i style="background:#55555E"></i>Half squat</span><span><i style="background:#FFA51E"></i>Full squat</span></div></div>`);
// each row on its own scale, so every comparison reads at full width
const mxOf=x=>x.b*1.22;
const bars=INFO.rows.map((x,i)=>{const y=650+i*250; const e=h(`<div class="row" style="top:${y}px"><div class="t"><b>${x.name}</b><span>${x.unit}</span></div>
 <div class="bar half"><i></i><em style="color:#E6E6EA"></em></div><div class="bar full"><i></i><em style="color:#140800"></em></div></div>`,res); return e;});
const quads=h(`<div class="abs" style="left:70px;right:70px;top:1415px;text-align:center;font:600 30px Inter;color:#C9C9D0">${INFO.quads}</div>`,res);
// takeaway
const take=h(`<div class="L"><img src="logo-wf.webp" class="abs" style="left:50%;transform:translateX(-50%);top:200px;height:54px">
 <div class="abs kan" style="left:0;right:0;top:560px;text-align:center;font-size:128px">${INFO.take[0]}<br><span class="or">${INFO.take[1]}</span></div>
 <div class="abs" style="left:90px;right:90px;top:1060px;text-align:center;font:600 38px/1.35 Inter;color:#E6E6EA">${INFO.takeSub}</div>
 <div class="abs" style="left:90px;right:90px;top:1240px;text-align:center;font:500 26px Inter;color:#8E8E98">${INFO.small}</div></div>`);
// save prompt
const cta=h(`<div class="L" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(8,8,10,.96);z-index:40">
 <img src="logo-wf.webp" style="height:70px;margin-bottom:60px">
 <div class="kan" style="font-size:110px">Save this<br><span class="or">for leg day</span></div>
 <div style="margin-top:40px;font:700 44px Barlow;text-transform:uppercase;color:#E6E6EA">Send it to your gym partner</div>
 <div style="margin-top:70px;padding:24px 40px;border:2px solid #FF7A1A;border-radius:26px;background:#121215;box-shadow:0 0 40px rgba(255,122,26,.35)">
  <div style="font:700 26px Inter;letter-spacing:.18em;color:#FF7A1A;text-transform:uppercase">Follow for more</div>
  <div class="kan" style="font-size:58px;margin-top:10px">@warfarefitnessapp</div></div></div>`,document.body);
const fade=(el,t,a,b)=>{const o=win(t,a,b,.3,.25);el.style.opacity=o;el.style.visibility=o>0?'visible':'hidden';el.style.transform=`translateY(${(1-ease((t-a)/.4))*30}px)`;};
const SP=2.6;
window.setT=async(t)=>{
  const ho=1-cl((t-(T.cmp-.3))/.3); hook.style.opacity=ho; hook.style.visibility=ho>0?'visible':'hidden'; hook.style.transform=`scale(${1+.05*cl(t/T.cmp)})`;
  const jobs=[];
  if(himg&&ho>0){himg.src='hook/f_'+String(Math.min(HOOKN-1,Math.floor(t*30*HSP))).padStart(4,'0')+'.jpg';jobs.push(himg.decode().catch(()=>{}));}
  fade(cmp,t,T.cmp,T.res); fade(res,t,T.res,T.take); fade(take,t,T.take,T.cta+.2);
  if(t>=T.cmp-.1&&t<T.res){P.forEach((p,i)=>{const span=p.to-p.from, k=Math.floor((t-T.cmp)*29.97*SP)%(span*2), f=p.from+(k<span?k:2*span-k); imgs[i].src=p.fr+'/f_'+String(f).padStart(4,'0')+'.jpg'; jobs.push(imgs[i].decode());});}
  bars.forEach((e,i)=>{const x=INFO.rows[i], k=ease((t-T.res-.6-i*.45)/.9), hb=e.querySelector('.half'), fb=e.querySelector('.full');
    hb.querySelector('i').style.width=(x.a/mxOf(x)*100*k)+'%'; fb.querySelector('i').style.width=(x.b/mxOf(x)*100*k)+'%';
    hb.querySelector('em').textContent=k>.05?'+'+(x.a*k).toFixed(1)+'%':''; fb.querySelector('em').textContent=k>.05?'+'+(x.b*k).toFixed(1)+'%':'';});
  quads.style.opacity=ease((t-T.res-2.4)/.6);
  { const k=ease((t-T.cta)/.35); cta.style.opacity=k; cta.style.visibility=k>0?'visible':'hidden'; }
  await Promise.all(jobs);
};
setT(+(Q.get('t')||0));
</script></body></html>
