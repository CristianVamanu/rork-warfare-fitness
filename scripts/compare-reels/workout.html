<!doctype html><html><head><meta charset="utf-8">
<!-- Warfare Fitness "complete workout" reel, white-panel style.
     One exercise per slide (clip in a white panel, sets x reps, rest), then a
     summary card of the whole session. render_panels.mjs drives window.setT(t).
     Timing: INTRO, then SLIDE seconds per exercise, then the summary. -->
<style>
@font-face{font-family:Kanit;src:url(kanit-800-italic.woff2)}
@font-face{font-family:Barlow;src:url(barlow-condensed-700.woff2)}
:root{--o:#FF7A1A;--o2:#FFA62B;--line:#2A2A30}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0B0B0D;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 100% 0%,rgba(255,122,26,.20),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(255,122,26,.16),transparent 60%),linear-gradient(180deg,#0E0E11,#08080A)}
/* Instagram safe zone, same as panels.html */
#r{position:absolute;inset:0;transform:scale(.88);transform-origin:50% 50%}
.streak{position:absolute;height:14px;background:linear-gradient(90deg,transparent,var(--o),var(--o2));transform:rotate(-38deg);border-radius:8px;filter:drop-shadow(0 0 14px rgba(255,122,26,.7))}
.logo{position:absolute;left:50%;top:150px;transform:translateX(-50%);height:54px}
.kan{font-family:Kanit;font-style:italic;font-weight:800;text-transform:uppercase;line-height:.92}
.or{background:linear-gradient(180deg,var(--o2),var(--o));-webkit-background-clip:text;background-clip:text;color:transparent}
.wh{background:linear-gradient(180deg,#fff,#C9C9D0);-webkit-background-clip:text;background-clip:text;color:transparent}
.layer{position:absolute;inset:0}
.panel{position:absolute;background:#fff;border-radius:38px;overflow:hidden;box-shadow:0 0 0 3px var(--o),0 0 50px rgba(255,122,26,.5),0 20px 60px rgba(0,0,0,.6)}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lab{font:700 22px Inter;letter-spacing:.2em;color:var(--o);text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border:2px solid rgba(255,122,26,.55);border-radius:18px;background:#121215;font:700 34px Barlow;text-transform:uppercase;letter-spacing:.02em}
.dots{position:absolute;left:0;right:0;top:262px;display:flex;justify-content:center;gap:12px}
.dots i{width:64px;height:8px;border-radius:4px;background:#2A2A30}
.dots i.on{background:var(--o);box-shadow:0 0 12px rgba(255,122,26,.7)}
.row{display:flex;align-items:center;gap:22px;padding:11px 22px;border:1.5px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(22,22,26,.95),rgba(12,12,14,.95));margin-bottom:12px}
.row .th{flex:0 0 104px;height:104px;border-radius:16px;background:#fff;overflow:hidden;position:relative}
.row .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.row .nm{flex:1;font:700 40px Barlow;text-transform:uppercase;line-height:1}
.row .nm small{display:block;font:500 21px Inter;color:#A7A7B0;text-transform:none;margin-top:6px}
.row .sr{font-family:Kanit;font-style:italic;font-weight:800;font-size:44px;white-space:nowrap}
</style></head><body><div class="bg"></div><div id="r"></div>
<script>
const W={
  title:['Ultimate','Calisthenics','Workout'], sub:'8 moves · full body · abs included',
  rest:'Rest 90 s', foot:'3 days a week · rest about 90 s between sets · stop 1 to 2 reps before failure',
  ex:[
    {name:'Pull-Up',fr:'fr_pullup',m:'Lats, biceps, mid back',sets:3,reps:'5–8'},
    {name:'Chest Dip',fr:'fr_dips',m:'Chest, triceps, front delts',sets:3,reps:'5–8'},
    {name:'Squat',fr:'fr_Squat',m:'Quads, glutes',sets:3,reps:'15–20'},
    {name:'Inverted Row',fr:'fr_invrow',m:'Mid back, lats, rear delts',sets:3,reps:'8–12'},
    {name:'Push-Up',fr:'fr_pushup',m:'Chest, triceps, core',sets:3,reps:'8–15'},
    {name:'Hanging Leg Raise',fr:'fr_hlr',m:'Abs, hip flexors',sets:3,reps:'8–12',abs:1},
    {name:'V-Up',fr:'fr_vup',m:'Abs',sets:3,reps:'8–12',abs:1},
    {name:'Side Plank',fr:'fr_sideplank',m:'Obliques',sets:3,reps:'20–30 s',per:'each side',abs:1},
  ]};
const Q=new URLSearchParams(location.search), INTRO=1.7, SLIDE=+(Q.get('slide')||2.4), SP=+(Q.get('speed')||2.5), N=W.ex.length, SUM=INTRO+N*SLIDE;
const r=document.getElementById('r'), h=(s)=>{r.insertAdjacentHTML('beforeend',s);return r.lastElementChild;};
h(`<div class="streak" style="width:460px;left:-170px;top:90px"></div>`);h(`<div class="streak" style="width:460px;right:-170px;top:40px"></div>`);h(`<div class="streak" style="width:520px;left:-240px;top:1730px"></div>`);
h(`<img class="logo" src="logo-wf.webp">`);
const intro=h(`<div class="layer"><div class="kan" style="position:absolute;left:0;right:0;top:640px;text-align:center;font-size:150px"><span class="wh">${W.title[0]}</span><br><span class="or">${W.title[1]}</span><br><span class="wh">${W.title[2]}</span></div>
 <div style="position:absolute;left:0;right:0;top:1130px;text-align:center"><span class="chip" style="font-size:40px">${W.sub}</span></div></div>`);
const dots=h(`<div class="dots">${W.ex.map(()=>'<i></i>').join('')}</div>`);
const slides=W.ex.map((x,i)=>h(`<div class="layer">
 <div class="lab" style="position:absolute;left:0;right:0;top:300px;text-align:center;font-size:26px">Exercise ${i+1} of ${N}${x.abs?' · abs':''}</div>
 <div class="panel" style="left:110px;top:360px;width:860px;height:860px"><img></div>
 <div class="kan wh" style="position:absolute;left:0;right:0;top:1262px;text-align:center;font-size:${x.name.length>13?92:112}px;white-space:nowrap">${x.name}</div>
 <div class="lab" style="position:absolute;left:0;right:0;top:1386px;text-align:center">${x.m}</div>
 <div class="kan or" style="position:absolute;left:0;right:0;top:1440px;text-align:center;font-size:150px;white-space:nowrap;filter:drop-shadow(0 0 26px rgba(255,122,26,.5))">${x.sets} × ${x.reps}</div>
 <div style="position:absolute;left:0;right:0;top:1608px;text-align:center"><span class="chip">${x.per?x.per+' · ':''}${W.rest}</span></div></div>`));
const sum=h(`<div class="layer"><div class="kan" style="position:absolute;left:0;right:0;top:250px;text-align:center;font-size:84px"><span class="wh">The full</span> <span class="or">workout</span></div>
 <div style="position:absolute;left:70px;right:70px;top:370px">${W.ex.map(x=>`<div class="row"><div class="th"><img src="${x.fr}/f_0090.jpg"></div><div class="nm">${x.name}<small>${x.m}</small></div><div class="sr or">${x.sets} × ${x.reps}</div></div>`).join('')}</div>
 <div style="position:absolute;left:70px;right:70px;top:1500px;text-align:center;font:600 30px/1.35 Inter;color:#E6E6EA">${W.foot}</div>
 <div class="kan" style="position:absolute;left:0;right:0;top:1640px;text-align:center;font-size:58px"><span class="wh">Save it.</span> <span class="or">Train it.</span></div></div>`);
const ease=(x)=>{x=Math.min(1,Math.max(0,x));return 1-Math.pow(1-x,3);};
// a layer is visible from t0 to t1, sliding in from the right and out to the left
const show=(el,t,t0,t1,dx=120)=>{const a=ease((t-t0)/.35), b=ease((t-(t1-.22))/.22);el.style.opacity=t<t0||t>=t1?0:a*(1-b);el.style.translate=`${(1-a)*dx-b*dx}px 0`;el.style.visibility=t<t0||t>=t1?'hidden':'visible';};
window.setT=async(t)=>{
  show(intro,t,-1,INTRO,0);intro.style.scale=1+.03*t;
  const cur=Math.floor((t-INTRO)/SLIDE);
  dots.style.opacity=t>=INTRO&&t<SUM?1:0;[...dots.children].forEach((d,i)=>d.className=i<=cur?'on':'');
  const jobs=[];
  slides.forEach((s,i)=>{const t0=INTRO+i*SLIDE;show(s,t,t0,t0+SLIDE);
    if(t>=t0&&t<t0+SLIDE){const im=s.querySelector('img');im.src=W.ex[i].fr+'/f_'+String(Math.floor((t-t0)*29.97*SP)%197).padStart(4,'0')+'.jpg';jobs.push(im.decode());}});
  show(sum,t,SUM,1e9,0);sum.style.translate=`0 ${(1-ease((t-SUM)/.45))*60}px`;
  await Promise.all(jobs);
};
window.DUR=SUM+4.3;
setT(+(Q.get('t')||0));
</script></body></html>
