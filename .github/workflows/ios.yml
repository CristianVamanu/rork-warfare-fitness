name: iOS app

# Builds the Capacitor iOS app on a macOS runner.
#
# Every push that touches the native shell does an unsigned simulator build,
# which proves the project still compiles. A manual run with the App Store
# Connect secrets present archives a signed release and uploads it to
# TestFlight / App Store Connect.
#
# Secrets (Settings → Secrets and variables → Actions), all from
# App Store Connect → Users and Access → Integrations → App Store Connect API
# (create a key with the Admin role):
#   APPLE_TEAM_ID          10-character Team ID (Membership details page)
#   ASC_KEY_ID             the API key's Key ID
#   ASC_ISSUER_ID          the Issuer ID shown above the keys list
#   ASC_PRIVATE_KEY_BASE64 base64 of the downloaded AuthKey_XXXX.p8 (base64 -w0)
#
# The app loads the live site, so it only needs rebuilding when the native
# shell changes (icon, name, plugins, permissions, version), never for web
# changes.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'cap-web/**'
      - 'package.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (integer, must increase for every upload)'
        required: true
        default: '1'
      version:
        description: 'Version shown to users'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Job-level so step `if`s can see it (secrets are not allowed there).
      ASC_KEY: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version

      - run: npm ci --ignore-scripts
      - run: npx cap sync ios

      - name: Set version
        if: github.event_name == 'workflow_dispatch'
        working-directory: ios/App
        run: |
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${{ github.event.inputs.version }};/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${{ github.event.inputs.build_number }};/g" App.xcodeproj/project.pbxproj

      - name: Simulator build (unsigned)
        if: env.ASC_KEY == '' || github.event_name != 'workflow_dispatch'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Archive and upload to App Store Connect (signed)
        if: env.ASC_KEY != '' && github.event_name == 'workflow_dispatch'
        working-directory: ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$ASC_KEY" | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          rm -f "$KEY"
