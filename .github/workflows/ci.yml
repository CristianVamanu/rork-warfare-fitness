name: CI

# Runs on every push and PR to any branch — catches a broken deploy before
# it ships, instead of only finding out from a live user report. This
# doesn't block auto-deploy (that's driven by the VPS webhook, not by this
# workflow's result) — it's a visibility check, not a gate, so a red run
# here is a signal to look, not something that stops the site updating.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm test
